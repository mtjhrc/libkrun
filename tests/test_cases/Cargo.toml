[package]
name = "test_cases"
edition = "2024"

[features]
host = ["krun", "krun/blk", "krun/net", "krun-init-blob", "libloading", "serde", "serde_json"]
guest = []

[lib]
name = "test_cases"

[dependencies]
krun = { path = "../../src/libkrun", package = "libkrun", optional = true }
krun-init-blob = { path = "../../init/init-blob", package = "krun-init-blob", features = ["direct"], optional = true }
libloading = { version = "0.8", optional = true }
macros = { path = "../macros" }
nix = { version = "0.29.0", features = ["fs", "socket", "ioctl", "user"] }
anyhow = "1.0.95"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tempdir = "0.3.7"
