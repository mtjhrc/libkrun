[package]
name = "runner"
edition = "2024"

[features]
default = ["static"]
static = ["test_cases/host"]
ffi = ["test_cases/host-ffi"]

[dependencies]
test_cases = { path = "../test_cases" }
anyhow = "1.0.95"
nix = { version = "0.29.0", features = ["resource", "fs", "signal", "process"] }
macros = { path = "../macros" }
clap = { version = "4.5.27", features = ["derive"] }
tempdir = "0.3.7"
