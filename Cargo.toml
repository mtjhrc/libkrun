[workspace]
members = [
    "src/libkrun",
    "init/init-blob",
    "bindings/init-blob-via-cdylib",
    "src/input",
    "src/display",
    "src/utils",
    "src/arch_gen",
    "src/cpuid",
    "src/smbios",
    "src/polly",
    "src/kernel",
    "src/arch",
    "src/hvf",
    "src/devices",
    "src/aws_nitro",
    "src/whp",
    "bindings/libkrun-via-cdylib-weak",
]
exclude = [
    "examples/gtk_display",
    "init/init-binary",
    "init/aws-nitro",
]
resolver = "2"
#panic = "abort"

[profile.release]
#panic = "abort"
lto = true

[workspace.dependencies]
ffier = { git = "https://github.com/mtjhrc/ffier.git", rev = "5629e94ab63ff2f3a3e9d605b77af79467dbf402" }
ffier-builtins = { git = "https://github.com/mtjhrc/ffier.git", rev = "5629e94ab63ff2f3a3e9d605b77af79467dbf402" }
ffier-gen-rust-client = { git = "https://github.com/mtjhrc/ffier.git", rev = "5629e94ab63ff2f3a3e9d605b77af79467dbf402" }
